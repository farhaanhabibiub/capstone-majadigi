  <rect x="80" y="380" width="740" height="170" rx="10" ry="10"
        fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="100" y="404" font-size="14" font-weight="700" fill="#1e40af">
    3.  Service Layer  —  Static Singletons + Repository/Facade
  </text>
  <g font-size="11.5" fill="#0f172a">
    <rect x="100" y="416" width="170" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="185" y="436" text-anchor="middle">AuthService</text>

    <rect x="280" y="416" width="170" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="365" y="436" text-anchor="middle">NotifikasiService</text>

    <rect x="460" y="416" width="170" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="545" y="436" text-anchor="middle">FeatureUsageService</text>

    <rect x="640" y="416" width="170" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="725" y="436" text-anchor="middle">ProfileCache</text>

    <rect x="100" y="454" width="170" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="185" y="474" text-anchor="middle">MajaAiHistoryService</text>

    <rect x="280" y="454" width="170" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="365" y="474" text-anchor="middle">GeminiService</text>

    <rect x="460" y="454" width="170" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="545" y="474" text-anchor="middle">StreakService</text>

    <rect x="640" y="454" width="170" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="725" y="474" text-anchor="middle">AuditLogService</text>

    <rect x="100" y="492" width="260" height="30" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="230" y="512" text-anchor="middle" font-weight="600">PersonalizationRuleBase (Strategy)</text>

    <rect x="370" y="492" width="200" height="30" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="470" y="512" text-anchor="middle" font-weight="600">ServiceRegistry</text>

    <rect x="580" y="492" width="230" height="30" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="695" y="512" text-anchor="middle" font-weight="600">FavoriteMixin / BiometricSvc</text>
  </g>

  <!-- Layer 4: Local Data -->
  <rect x="80" y="565" width="740" height="105" rx="10" ry="10"
        fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="100" y="589" font-size="14" font-weight="700" fill="#1e40af">
    4.  Local Data  (Cache-Aside / Offline-First)
  </text>
  <g font-size="11.5" fill="#0f172a">
    <rect x="100" y="600" width="220" height="56" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="210" y="622" text-anchor="middle" font-weight="600">SharedPreferences</text>
    <text x="210" y="640" text-anchor="middle" fill="#475569">feature_usage, streak, favorit, cache profil</text>

    <rect x="330" y="600" width="220" height="56" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="440" y="622" text-anchor="middle" font-weight="600">CSV Assets</text>
    <text x="440" y="640" text-anchor="middle" fill="#475569">kendaraan, NJKB, kamar/jadwal RSUD, bansos</text>

    <rect x="560" y="600" width="250" height="56" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="685" y="622" text-anchor="middle" font-weight="600">Deferred Loading</text>
    <text x="685" y="640" text-anchor="middle" fill="#475569">import '...' deferred as → DeferredFeaturePage</text>
  </g>

  <!-- Cross-cutting -->
  <rect x="80" y="685" width="740" height="34" rx="8" ry="8"
        fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="450" y="707" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">
    Cross-cutting  •  AppTheme (light/dark)  •  FontScale  •  Semantics  •  Skeleton/EmptyState/ErrorRetry  •  Hero animations
  </text>

  <!-- ===== EXTERNAL SERVICES ===== -->
  <!-- Firebase -->
  <rect x="880" y="90" width="340" height="200" rx="14" ry="14"
        fill="url(#firebaseGrad)" stroke="#f97316" stroke-width="2"/>
