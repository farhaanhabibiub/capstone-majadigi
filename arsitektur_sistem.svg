<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <linearGradient id="clientGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="firebaseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="640" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">
    Arsitektur Sistem — Majadigi
  </text>
  <text x="640" y="62" text-anchor="middle" font-size="13" fill="#64748b">
    Client-Heavy Hybrid + Firebase BaaS  •  Feature-Modular Flutter App
  </text>

  <!-- ===== CLIENT (Flutter App) ===== -->
  <rect x="60" y="90" width="780" height="640" rx="14" ry="14"
        fill="url(#clientGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="80" y="120" font-size="16" font-weight="700" fill="#1e3a8a">
    CLIENT — Flutter App (Android / iOS)
  </text>
  <text x="80" y="140" font-size="12" fill="#475569">
    Feature-based modular  •  Centralized routing  •  Static-singleton services
  </text>

  <!-- Layer 1: Presentation -->
  <rect x="80" y="160" width="740" height="120" rx="10" ry="10"
        fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="100" y="184" font-size="14" font-weight="700" fill="#1e40af">
    1.  Presentation Layer  (lib/&lt;feature&gt;/*.dart)
  </text>
  <g font-size="11.5" fill="#0f172a">
    <rect x="100" y="198" width="135" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="167.5" y="218" text-anchor="middle">Beranda + Favorit + Profil</text>

    <rect x="245" y="198" width="135" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="312.5" y="218" text-anchor="middle">Bapenda / RSUD / Transjatim</text>

    <rect x="390" y="198" width="135" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="457.5" y="218" text-anchor="middle">Siskaperbapo / Etibi</text>

    <rect x="535" y="198" width="135" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="602.5" y="218" text-anchor="middle">Sapa Bansos / Klinik Hoaks</text>

    <rect x="680" y="198" width="130" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="745" y="218" text-anchor="middle">Open Data / Admin</text>

    <rect x="100" y="238" width="320" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="260" y="257" text-anchor="middle" font-weight="600">Maja AI Chat (streaming)</text>

    <rect x="430" y="238" width="380" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="620" y="257" text-anchor="middle" font-weight="600">
      Centralized Router  —  AppRoutes.generateRoute (Fade/Slide)
    </text>
  </g>

  <!-- Layer 2: State Management -->
  <rect x="80" y="295" width="740" height="70" rx="10" ry="10"
        fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="100" y="319" font-size="14" font-weight="700" fill="#1e40af">
    2.  State Management
  </text>
  <g font-size="11.5" fill="#0f172a">
    <rect x="100" y="330" width="220" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="210" y="348" text-anchor="middle">setState (state lokal per page)</text>

    <rect x="330" y="330" width="240" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="450" y="348" text-anchor="middle">ValueNotifier (Theme, FontScale)</text>

    <rect x="580" y="330" width="230" height="26" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="695" y="348" text-anchor="middle">No Provider / Bloc / Riverpod</text>
  </g>

