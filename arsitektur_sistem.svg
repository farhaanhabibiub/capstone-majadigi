    <rect x="900" y="178" width="300" height="30" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="915" y="198">Cloud Firestore  —  users, notifications, hoaks</text>

    <rect x="900" y="216" width="300" height="30" rx="6" fill="#ffffff" stroke="#fdba74"/>
