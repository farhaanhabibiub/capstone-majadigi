    <rect x="900" y="566" width="300" height="28" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="915" y="585">bcryptjs + nodemailer + dotenv</text>
  </g>

  <!-- Pemerintah Jatim layer (data source) -->
  <rect x="880" y="630" width="340" height="100" rx="14" ry="14"
