    <rect x="900" y="392" width="300" height="28" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="915" y="411">Streaming chat + sliding-window rate limit</text>
  </g>

  <!-- Node Backend -->
  <rect x="880" y="450" width="340" height="160" rx="14" ry="14"
