  <text x="900" y="660" font-size="16" font-weight="700" fill="#6b21a8">
    Data Sources (eksternal/manual)
  </text>
  <g font-size="12" fill="#0f172a">
    <rect x="900" y="676" width="300" height="46" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
    <text x="915" y="696">Bapenda, RSUD, Transjatim, Siskaperbapo,</text>
    <text x="915" y="713">Sapa Bansos, Open Data, Klinik Hoaks (manual ingest)</text>
  </g>

  <!-- Connectors -->
  <line x1="840" y1="190" x2="880" y2="190" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="840" y1="370" x2="880" y2="370" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="840" y1="530" x2="880" y2="530" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

