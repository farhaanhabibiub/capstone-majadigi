    <rect x="900" y="254" width="300" height="30" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="915" y="274">FCM (Push Notification + background msg)</text>
  </g>

  <!-- Gemini -->
  <rect x="880" y="310" width="340" height="120" rx="14" ry="14"
        fill="url(#geminiGrad)" stroke="#6366f1" stroke-width="2"/>
